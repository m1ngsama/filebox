<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15181d" />
    <meta name="apple-mobile-web-app-title" content="filebox" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>filebox</title>
    <script>try{var d=document.documentElement,t=localStorage.getItem('theme'),p=JSON.parse(localStorage.getItem('prefs')||'{}');if(t==='light'||t==='dark')d.dataset.theme=t;if(/^[a-z]{1,12}$/.test(p.accent))d.dataset.accent=p.accent;if(p.density==='compact')d.dataset.density='compact'}catch(e){}</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
