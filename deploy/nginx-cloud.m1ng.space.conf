server {
    listen 80;
    listen [::]:80;
    server_name cloud.m1ng.space;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.m1ng.space;

    ssl_certificate /etc/letsencrypt/live/cloud.m1ng.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.m1ng.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # oss has 25G of disk; buffering multi-GB bodies there would fill it.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    location / {
        proxy_pass http://127.0.0.1:15280;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
