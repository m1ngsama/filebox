name: release
# A pushed version tag builds the binaries and opens a DRAFT release. Nothing is public until the
# maintainer reviews the draft and publishes it by hand; publishing then builds the Docker image (image.yml).
# Nothing here deploys anywhere. Publishing the release builds the images, and that workflow then asks the maintainer
# to approve the deploy to production (image.yml).
# The rules for a release are in RELEASING.md.
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a plain version tag, on main, whose CI passed
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not a commit on main"; exit 1; }
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$ok" -gt 0 ] || { echo "::error::CI has not passed on $GITHUB_SHA"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make web
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            d="filebox_${TAG}_${os}_${arch}"
            mkdir "$d"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.buildTag=$TAG" -o "$d/filebox" ./cmd/filebox
            cp LICENSE README.md "$d/"
            tar czf "dist/$d.tar.gz" "$d"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --generate-notes
