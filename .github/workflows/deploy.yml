name: deploy
# Publishing a release offers it to production. The job waits in the `production` environment until the maintainer
# approves it on GitHub, so nothing reaches the server without a person saying yes to that exact version.
# The release archive is checked here, against the release's SHA256SUMS and its build attestation, and sent to the server
# over SSH, because the server cannot reach github.com reliably.
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # A prerelease is never deployed.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    # The SSH credentials exist in this environment only, and it accepts version tags only: no pull request,
    # branch or CI job can read them.
    environment:
      name: production
      url: https://cloud.m1ng.space
    env:
      TAG: ${{ github.event.release.tag_name }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      PORT: ${{ vars.DEPLOY_PORT }}
      ARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
      USER_: ${{ secrets.DEPLOY_USER }}
      URL: https://cloud.m1ng.space
    steps:
      - name: Only a plain version tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vMAJOR.MINOR.PATCH"; exit 1; }'
      - name: Trust only the server we pinned
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Fetch the release and check it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "filebox_${TAG}_linux_${ARCH}.tar.gz" --pattern SHA256SUMS
          grep -F " filebox_${TAG}_linux_${ARCH}.tar.gz" SHA256SUMS | sha256sum -c -
          gh attestation verify "filebox_${TAG}_linux_${ARCH}.tar.gz" --repo "$GITHUB_REPOSITORY"
      # The key can only run the server's deploy script: a version, the archive's SHA-256, then the archive.
      - name: Install it and restart
        run: |
          f="filebox_${TAG}_linux_${ARCH}.tar.gz"
          { echo "$TAG"; sha256sum "$f" | cut -d' ' -f1; cat "$f"; } | ssh -p "$PORT" -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER_@$HOST"
      - name: It answers, or it goes back
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL/" || true)
            case "$code" in 2*|3*) echo "up after $i tries"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::$URL did not answer, going back to the previous version"
          echo rollback | ssh -p "$PORT" -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER_@$HOST"
          exit 1
