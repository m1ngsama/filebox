name: deploy
# Publishing a release offers it to production. The job waits in the `production` environment until the maintainer
# approves it on GitHub, so nothing reaches the server without a person saying yes to that exact version.
# The server downloads the release itself and checks it against the release's SHA256SUMS; this job only names the version.
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # A prerelease is never deployed.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The SSH credentials exist in this environment only, and it accepts version tags only: no pull request,
    # branch or CI job can read them.
    environment:
      name: production
      url: https://cloud.m1ng.space
    env:
      TAG: ${{ github.event.release.tag_name }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      PORT: ${{ vars.DEPLOY_PORT }}
      USER_: ${{ secrets.DEPLOY_USER }}
      URL: https://cloud.m1ng.space
    steps:
      - name: Only a plain version tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vMAJOR.MINOR.PATCH"; exit 1; }'
      - name: Trust only the server we pinned
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      # The key can only run the server's deploy script, which reads one line from standard input: a version, or `rollback`.
      - name: Install the release and restart
        run: echo "$TAG" | ssh -p "$PORT" -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER_@$HOST"
      - name: It answers, or it goes back
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL/" || true)
            case "$code" in 2*|3*) echo "up after $i tries"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::$URL did not answer, going back to the previous version"
          echo rollback | ssh -p "$PORT" -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER_@$HOST"
          exit 1
