name: image
# Builds and pushes the Docker image when a maintainer publishes a release, never on a tag alone.
on:
  release:
    types: [published]
permissions: {}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          tags="ghcr.io/${REPO,,}:$TAG"
          [ "$PRERELEASE" = true ] || tags="$tags,ghcr.io/${REPO,,}:latest"
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          # The image with Office previews and text-in-images search: vX.Y.Z-full, and `full` for a release that is not a prerelease.
          full="ghcr.io/${REPO,,}:$TAG-full"
          [ "$PRERELEASE" = true ] || full="$full,ghcr.io/${REPO,,}:full"
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.full }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
