name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'deploy/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'deploy/**', 'LICENSE', '.gitignore']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-pw-${{ hashFiles('web/bun.lock', 'e2e/bun.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: make size
      - run: make test
      - run: cd e2e && bun install --frozen-lockfile && bunx playwright install --with-deps chromium webkit
      - run: make e2e
