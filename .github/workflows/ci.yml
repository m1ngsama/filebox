name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'deploy/**', 'LICENSE', '.gitignore']
  # Every pull request runs the checks, even one that only touches docs: main requires them, and a check that is skipped never reports.
  pull_request:
  workflow_dispatch:
# CI never receives a secret, and its token can only read the repository.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('web/bun.lock') }}
      - run: make size

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A slow mirror must not hold the job until its timeout. Without these tools the tests that need them skip,
      # so after four minutes the job goes on without them rather than failing.
      - timeout-minutes: 4
        continue-on-error: true
        run: |
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg poppler-utils || (sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg poppler-utils)
      - run: go vet ./...
      - run: make test

  # Pushes to main are checked locally with the full suite first; the browser run guards pull requests.
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: bun-pw-${{ hashFiles('web/bun.lock', 'e2e/bun.lock') }}
      # The browser tests need ffmpeg; a mirror slower than this fails the job early instead of at its timeout.
      - timeout-minutes: 6
        run: |
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg || (sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg)
      - run: cd e2e && bun install --frozen-lockfile && bunx playwright install --with-deps --only-shell chromium
      - run: make e2e

  # Stops a build whose Go toolchain or dependencies carry a known vulnerability the code can reach.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg VERSION=ci --build-arg REVISION=$GITHUB_SHA -t filebox:ci .
      - name: The image reports the commit it was built from
        run: docker run --rm filebox:ci version | grep -F "${GITHUB_SHA::7}"
